---
# Despliegue desde cPanel > Git Version Control > "Deploy HEAD Commit".
# Copia solo los archivos de la web a public_html (sobrescribe los existentes;
# no borra archivos viejos del servidor).
deployment:
  tasks:
    - export DEPLOYPATH=/home/medicalhealth/public_html/
    - /bin/cp -f index.html about.html productos.html contacto.html 404.html robots.txt sitemap.xml .htaccess $DEPLOYPATH
    - /bin/cp -Rf css js images assets favicon equipos $DEPLOYPATH
